name: Match Data Web Scraping
on:
  schedule:
     - cron: '24 1,13 * * *'
    
jobs:
  web_scraping:
    runs-on: ubuntu-latest
    concurrency:
      group: scrape-data
      cancel-in-progress: true
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          
      - name: Installed package list
        run: apt list --installed
      
      - name: Install ChromeDriver matching installed Chrome
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
          echo "Chrome version: $CHROME_VERSION"
          if ! wget -q "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chromedriver-linux64.zip" -O chromedriver.zip; then
            # Version exacte absente : on prend le dernier driver de la même version majeure
            DRIVER_VERSION=$(curl -fsS "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_VERSION%%.*}")
            echo "Exact driver not found, using $DRIVER_VERSION"
            wget -q "https://storage.googleapis.com/chrome-for-testing-public/${DRIVER_VERSION}/linux64/chromedriver-linux64.zip" -O chromedriver.zip
          fi
          unzip -oq chromedriver.zip
          sudo cp chromedriver-linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Install all necessary packages
        # six : requis par kaggle 2.x mais absent de ses dépendances déclarées
        run: pip install requests beautifulsoup4 pandas webdriver_manager selenium kaggle six
        
      - name: Run the latest matches scraping script
        run: python scripts/000_Web_Scraping/001_Scraping_Latest_Matches.py
        
      - name: Run the fixtures scraping script
        run: python scripts/000_Web_Scraping/002_Scraping_Future_Matches.py
        
      - name: Commit and push changes
        run: |
          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USERNAME }}"

          if git diff --quiet -- data/source/; then
            echo "No changes in data/source/ directory. Skipping commit."
            exit 0
          fi

          git add -A data/source/
          git commit -m "Update data/source/" || exit 0

          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          # Sync with latest remote
          git fetch origin main

          # Utiliser --force-with-lease pour gérer l'historique divergé
          # C'est plus sûr que --force car ça protège contre les pertes de données
          git push origin HEAD:main --force-with-lease || echo "Push failed, trying to recover..."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create .kaggle directory
        run: mkdir -p /home/runner/.kaggle
        
      - name: Set up Kaggle credentials
        run: echo "$KAGGLE_JSON" > /home/runner/.kaggle/kaggle.json && chmod 600 /home/runner/.kaggle/kaggle.json
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
          
      - name: Update Kaggle
        run: |
          cd data/source/match_dataset
          kaggle datasets version -p . -m "Updated data"
